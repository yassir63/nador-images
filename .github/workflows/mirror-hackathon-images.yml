name: Mirror recorded hackathon images

on:
  push:
    branches: [mirror-hackathon-images]
    paths: [.github/workflows/mirror-hackathon-images.yml]

permissions:
  contents: read
  packages: write

jobs:
  mirror:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        record:
          - controller/2026w44
          - throughput-probe/2026w44
          - latency-probe/2026w43
          - latency-probe/2026w43-fragments
          - packet-pairer/2026w43
          - kpi-calculator-oai/2026w43-radio-scoped
          - amf-sniffer/2026w43
          - smf-sniffer/2026w43
          - ue-mapper/2026w43
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Install registry copy tool
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo
      - name: Copy original image and verify digest
        env:
          RECORD: ${{ matrix.record }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          record="versions/$RECORD.json"
          original=$(jq -er '.image | select(startswith("r2labuser/"))' "$record")
          digest=$(jq -er '.digest | select(test("^sha256:[0-9a-f]{64}$"))' "$record")
          image=${original%:*}
          dest="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${image#*/}:original-${original##*:}"
          printf '%s' "$GHCR_TOKEN" | skopeo login --username "$GITHUB_ACTOR" --password-stdin ghcr.io
          skopeo copy --all --preserve-digests "docker://docker.io/$image@$digest" "docker://$dest"
          actual=$(skopeo inspect --raw "docker://$dest" | sha256sum)
          test "sha256:${actual%% *}" = "$digest"
          printf 'Verified `%s@%s`\n' "${dest%:*}" "$digest" >> "$GITHUB_STEP_SUMMARY"
