name: Build experimental Nador probes

on:
  push:
    branches: [ml-extended]
    paths: [extended-node/**, extended-service/**, common/active_checks.py, .github/workflows/extended-probes.yml]
  pull_request:
    paths: [extended-node/**, extended-service/**, common/active_checks.py, .github/workflows/extended-probes.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: extended-probes-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - run: |
          python3 -m venv /tmp/extended-tests
          /tmp/extended-tests/bin/pip install pytest prometheus-client==0.21.1 requests==2.32.5
          PYTHONPATH=extended-node:extended-service:common /tmp/extended-tests/bin/python -m pytest --import-mode=importlib -q extended-node extended-service
  build:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        component: [extended-node, extended-service]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Build from source
        env:
          COMPONENT: ${{ matrix.component }}
        run: |
          docker build --pull --platform linux/amd64 -f "$COMPONENT/Dockerfile" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            -t "ghcr.io/${GITHUB_REPOSITORY_OWNER}/nador-$COMPONENT:extended-$GITHUB_SHA" .
          docker run --rm --network none --entrypoint python3 \
            "ghcr.io/${GITHUB_REPOSITORY_OWNER}/nador-$COMPONENT:extended-$GITHUB_SHA" -m compileall -q /app
      - name: Verify packaged tools
        if: matrix.component == 'extended-node'
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/nador-extended-node:extended-${{ github.sha }}
        run: |
          docker run --rm --network none --entrypoint python3 "$IMAGE" -c 'from bcc import BPF; import requests, prometheus_client'
          docker run --rm --network none --entrypoint tshark "$IMAGE" --version
      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/ml-extended'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish isolated experimental image and provenance
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/ml-extended'
        env:
          COMPONENT: ${{ matrix.component }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER}/nador-$COMPONENT:extended-$GITHUB_SHA"
          docker push "$image"
          docker buildx imagetools inspect "$image" --format '{{json .Manifest}}' > manifest.json
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          record = dict(component=os.environ['COMPONENT'], source_repository=os.environ['GITHUB_REPOSITORY'],
                        source_commit=os.environ['GITHUB_SHA'],
                        digest=json.loads(Path('manifest.json').read_text())['digest'])
          Path('build-record.json').write_text(json.dumps(record, indent=2))
          PY
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/ml-extended'
        with:
          name: nador-${{ matrix.component }}-${{ github.sha }}
          path: build-record.json
