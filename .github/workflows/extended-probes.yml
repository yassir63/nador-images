name: Build experimental Nador probes

on:
  push:
    branches: [ml-extended]
    paths: [extended-node/**, extended-service/**, amf-visibility/**, latency-probe/**, n3-oneway/**, common/tunnel_identity.py, .github/workflows/extended-probes.yml]
  pull_request:
    paths: [extended-node/**, extended-service/**, amf-visibility/**, latency-probe/**, n3-oneway/**, common/tunnel_identity.py, .github/workflows/extended-probes.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: extended-probes-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - run: |
          python3 -m venv /tmp/extended-tests
          /tmp/extended-tests/bin/pip install pytest prometheus-client==0.21.1 requests==2.32.5
          PYTHONPATH=extended-node:extended-service /tmp/extended-tests/bin/python -m pytest --import-mode=importlib -q extended-node extended-service
          cc -std=c11 -Wall -Wextra -Werror -I latency-probe latency-probe/tests/test_tcp_repeat.c -o /tmp/test-tcp-repeat
          /tmp/test-tcp-repeat
          python3 -m unittest discover -s n3-oneway
  build:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        component: [extended-node, extended-service, probe-cpu, probe-drops, probe-queueing, probe-tcp, probe-split-signaling, probe-measurement-quality, amf-visibility, latency-probe, n3-oneway]
    env:
      IMAGE: ghcr.io/yassir63/${{ matrix.component == 'latency-probe' && 'ebpf-latency-probe' || format('nador-{0}', matrix.component) }}:extended-${{ github.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Build from source
        env:
          COMPONENT: ${{ matrix.component }}
        run: |
          dockerfile="$COMPONENT/Dockerfile"
          args=()
          case "$COMPONENT" in
            probe-measurement-quality) dockerfile=extended-service/Dockerfile.probe ;;
            probe-*) dockerfile=extended-node/Dockerfile.probe ;;
          esac
          if [[ "$COMPONENT" == probe-* ]]; then
            args+=(--build-arg "PROBE_KIND=${COMPONENT#probe-}")
          fi
          docker build --pull --platform linux/amd64 -f "$dockerfile" "${args[@]}" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            -t "$IMAGE" .
          docker run --rm --network none --entrypoint python3 \
            "$IMAGE" -m compileall -q /app
      - name: Verify packaged tools
        if: matrix.component == 'extended-node' || matrix.component == 'probe-cpu' || matrix.component == 'probe-drops'
        run: |
          docker run --rm --network none --entrypoint python3 "$IMAGE" -c 'from bcc import BPF; import requests, prometheus_client'
      - name: Verify TCP path metric labels
        if: matrix.component == 'latency-probe'
        run: |
          docker run --rm --network none --entrypoint python3 -e PYTHONPATH=/app \
            -v "$PWD/latency-probe/tests/test_tcp_path_exporter.py:/test.py:ro" "$IMAGE" /test.py
      - name: Verify decoder package
        if: matrix.component == 'extended-node' || matrix.component == 'probe-split-signaling' || matrix.component == 'amf-visibility'
        run: docker run --rm --network none --entrypoint tshark "$IMAGE" --version
      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/ml-extended'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          registry: ghcr.io
          username: yassir63
          password: ${{ secrets.GHCR_PUBLISH_TOKEN }}
      - name: Publish isolated experimental image and provenance
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/ml-extended'
        env:
          COMPONENT: ${{ matrix.component }}
        run: |
          docker push "$IMAGE"
          docker buildx imagetools inspect "$IMAGE" --format '{{json .Manifest}}' > manifest.json
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          record = dict(component=os.environ['COMPONENT'], source_repository=os.environ['GITHUB_REPOSITORY'],
                        source_commit=os.environ['GITHUB_SHA'],
                        digest=json.loads(Path('manifest.json').read_text())['digest'])
          Path('build-record.json').write_text(json.dumps(record, indent=2))
          PY
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/ml-extended'
        with:
          name: nador-${{ matrix.component }}-${{ github.sha }}
          path: build-record.json
