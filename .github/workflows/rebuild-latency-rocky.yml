name: Rebuild latency and OAI calculator from source

on:
  push:
    branches: [rebuild-latency-rocky]

permissions:
  contents: read
  packages: write

jobs:
  latency:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Verify patched source checksums
        run: |
          sha256sum --check latency-probe-rocky/SHA256SUMS
          cmp latency-probe/gtp_latency.bpf.c latency-probe-rocky/gtp_latency.bpf.c
      - name: Record original installed package inventory
        run: |
          docker run --rm --platform linux/amd64 --network none --entrypoint rpm \
            r2labuser/ebpf-latency-probe@sha256:b0444e0d606891f45667c6d05d672be277559a87e4858efc2cd1fd9a0a82e80e \
            -qa | sort
      - name: Build from the original official base
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ebpf-latency-probe:rocky-${GITHUB_SHA}"
          docker build --pull --platform linux/amd64 -f latency-probe-rocky/Dockerfile \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" -t "$image" .
          echo "IMAGE=$image" >> "$GITHUB_ENV"
      - name: Check packaged runtime
        run: |
          set -euo pipefail
          docker run --rm --network none --entrypoint bash "$IMAGE" -c '
            set -euo pipefail
            python3 -m pip check
            python3 -c "from importlib.metadata import version; assert version(\"Flask\")==\"3.1.1\"; assert version(\"prometheus-client\")==\"0.22.0\""
            python3 -m compileall -q exporter.py latency_socket_server.py tunnel_identity.py
            bash -n entrypoint-latency.sh
            ! ldd gtp_latency_user | grep "not found"
            tc -V
            bpftool version
            rpm -qa | sort
          '
      - name: Publish isolated Rocky test tag
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE"
          docker buildx imagetools inspect "$IMAGE" >> "$GITHUB_STEP_SUMMARY"
  calculator:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Build standalone calculator
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/kpi-calculator-oai:source-${GITHUB_SHA}"
          docker build --pull --platform linux/amd64 \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            -t "$image" kpi-calculator-oai
          echo "IMAGE=$image" >> "$GITHUB_ENV"
      - name: Validate calculator runtime and behavior
        run: |
          set -euo pipefail
          docker run --rm --network none --entrypoint python3 "$IMAGE" -m pip check
          docker run --rm --network none --entrypoint python3 "$IMAGE" -m compileall -q .
          docker run --rm --network none --entrypoint python3 \
            -v "$PWD/tests/check_source_rebuilds.py:/checks.py:ro" "$IMAGE" /checks.py calculator
      - name: Publish isolated calculator test tag
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE"
          docker buildx imagetools inspect "$IMAGE" >> "$GITHUB_STEP_SUMMARY"
